name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace

      - name: Build
        run: cargo build --release

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  # wasm/ is a separate workspace -- it path-depends on this crate, so
  # `--workspace` in the jobs above never reaches it. Without this job its
  # bindings are never linted and a wasm32 regression ships unnoticed: the
  # getrandom-backend class of problem compiles cleanly and only fails at
  # runtime, on the first render.
  wasm:
    name: WebAssembly
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm

      - name: Check formatting
        working-directory: wasm
        run: cargo fmt --all -- --check

      - name: Run clippy
        working-directory: wasm
        run: cargo clippy --all-targets -- -D warnings

      # The target that matters: everything above can pass while wasm32 fails.
      # RUSTFLAGS mirrors wasm-build.sh -- getrandom needs the cfg as well as
      # the feature, and without it this builds and dies at runtime instead.
      - name: Build for wasm32
        working-directory: wasm
        env:
          RUSTFLAGS: --cfg getrandom_backend="wasm_js"
        run: cargo build --release --target wasm32-unknown-unknown

      # End to end, because compiling is not evidence that it works.
      # PINNED, not `latest`. This action resolves `latest` by asking the
      # GitHub API, and when that call fails it does not fail the step — it
      # silently falls back to its own default, wasm-pack v0.9.1, whose
      # wasm-opt is too old to parse what wasm-bindgen emits. The build then
      # dies with "Only 1 table definition allowed in MVP", which names
      # nothing relevant. pdf-handouts hit exactly that on 2026-09-01.
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'v0.15.0'

      - name: Render every layout and validate the PDFs
        run: |
          ./wasm-build.sh --target nodejs --out-dir pkg-node
          node wasm/verify.mjs
