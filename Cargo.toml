[package]
name = "pbn-to-pdf"
version = "0.18.0"
edition = "2021"
description = "Convert PBN bridge files to PDF with Bridge Composer-style formatting"
license = "Unlicense"

[features]
default = ["cli"]
# Argument parsing and logging for the binaries. Off for wasm, where clap and
# env_logger are dead weight and there is no argv to parse.
cli = ["dep:clap", "dep:env_logger"]

[dependencies]
clap = { version = "4.5", features = ["derive"], optional = true }
printpdf = { git = "https://github.com/fschutt/printpdf", rev = "1f30cafc", features = ["svg"] }
nom = "8.0"
thiserror = "2.0"
anyhow = "1.0"
log = "0.4"
env_logger = { version = "0.11", optional = true }
bridge-types = { git = "https://github.com/bridge-craftwork/bridge-types" }
lopdf = "0.35"  # PDF post-processing for compression

[[bin]]
name = "pbn-to-pdf"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "layout_debug"
path = "src/bin/layout_debug.rs"
required-features = ["cli"]
